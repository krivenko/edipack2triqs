name: Test

on:
  push:
    branches:
      - main
      - ci
  pull_request:
    branches:
      - main
  schedule:
    - cron:  '0 0 * * 2'

# A new push to the same branch makes the running build obsolete
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Allow pushes to gh-pages
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    env:
      DEPLOY_DOCS: ${{ github.ref == 'refs/heads/main' &&
                       matrix.python-version == '3.14' }}
      # Bump this to invalidate all dependency caches, e.g. after changing
      # build options of one of the dependencies below.
      CACHE_VERSION: 1

    steps:
    - name: Install dependencies
      shell: "bash -l {0}"
      run: |
           sudo apt-get update -q
           sudo apt-get install -y gfortran g++-14 libopenmpi-dev libboost-dev \
               libblas-dev liblapack-dev libfftw3-dev libgmp-dev libhdf5-dev   \
               libscalapack-mpi-dev

    # Commit hashes of the dependencies are used as parts of cache keys.
    - name: Resolve revisions of dependencies
      id: revs
      shell: "bash -l {0}"
      run: |
           set -euo pipefail
           rev() { git ls-remote "$1" "${2:-HEAD}" | cut -f1; }
           GH=https://github.com
           {
             echo "scifor=$(rev $GH/SciFortran/SciFortran)"
             echo "edipack=$(rev $GH/edipack/EDIpack)"
             echo "edipack2py=$(rev $GH/EDIpack/EDIpack2py)"
             echo "triqs=$(rev $GH/TRIQS/triqs refs/heads/4.0.x)"
             # Runner image, e.g. 'ubuntu24'
             echo "image=${ImageOS:-unknown}"
           } >> "${GITHUB_OUTPUT}"

    - name: Cache SciFortran installation
      id: cache-scifor
      uses: actions/cache@v4
      with:
        path: ~/scifor
        key: scifor-${{ steps.revs.outputs.image }}-${{
             steps.revs.outputs.scifor }}-v${{ env.CACHE_VERSION }}

    - name: Build & install SciFortran
      if: steps.cache-scifor.outputs.cache-hit != 'true'
      shell: "bash -l {0}"
      env:
        FC: mpifort
      run: |
           git clone --depth 1 https://github.com/SciFortran/SciFortran.git    \
                               scifor.git
           mkdir scifor.build && pushd scifor.build
           cmake ../scifor.git                                                 \
             -DCMAKE_BUILD_TYPE=Release                                        \
             -DCMAKE_INSTALL_PREFIX=${HOME}/scifor
           make -j2
           make install
           popd

    # EDIpack is built against SciFortran, hence both revisions in the key.
    - name: Cache EDIpack installation
      id: cache-edipack
      uses: actions/cache@v4
      with:
        path: ~/edipack
        key: edipack-${{ steps.revs.outputs.image }}-${{
             steps.revs.outputs.scifor }}-${{
             steps.revs.outputs.edipack }}-v${{ env.CACHE_VERSION }}

    - name: Build & install EDIpack
      if: steps.cache-edipack.outputs.cache-hit != 'true'
      shell: "bash -l {0}"
      env:
        FC: mpifort
      run: |
           git clone --depth 1 https://github.com/edipack/EDIpack EDIpack.git
           mkdir EDIpack.build && pushd EDIpack.build
           export PKG_CONFIG_PATH="${HOME}/scifor/etc:${PKG_CONFIG_PATH}"
           cmake ../EDIpack.git                                                \
              -DCMAKE_BUILD_TYPE=Release                                       \
              -DCMAKE_INSTALL_PREFIX=${HOME}/edipack                           \
              -DCMPLX_NORMAL=ON
           make -j2
           make install
           popd

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      shell: "bash -l {0}"
      run: |
           python -m pip install --upgrade pip
           pip install --user \
               numpy scipy matplotlib mpi4py mako pytest networkx

    - name: Cache edipack2py wheel
      id: cache-edipack2py
      uses: actions/cache@v4
      with:
        path: ~/edipack2py.wheel
        key: edipack2py-${{ steps.revs.outputs.image }}-py${{
             matrix.python-version }}-${{
             steps.revs.outputs.edipack2py }}-v${{ env.CACHE_VERSION }}

    - name: Build edipack2py wheel
      if: steps.cache-edipack2py.outputs.cache-hit != 'true'
      shell: "bash -l {0}"
      run: |
           git clone --depth 1 https://github.com/EDIpack/EDIpack2py           \
                               EDIpack2py.git
           pip wheel --no-deps --wheel-dir ${HOME}/edipack2py.wheel            \
                     ./EDIpack2py.git

    - name: Install edipack2py
      shell: "bash -l {0}"
      run: pip install --user ${HOME}/edipack2py.wheel/*.whl

    # TRIQS installs Python modules, hence the Python version in the key.
    - name: Cache TRIQS installation
      id: cache-triqs
      uses: actions/cache@v4
      with:
        path: ~/triqs
        key: triqs-${{ steps.revs.outputs.image }}-py${{
             matrix.python-version }}-${{
             steps.revs.outputs.triqs }}-v${{ env.CACHE_VERSION }}

    - name: Build & install TRIQS
      if: steps.cache-triqs.outputs.cache-hit != 'true'
      shell: "bash -l {0}"
      env:
        CXX: g++-14
      run: |
           git clone --depth 1 --branch 4.0.x https://github.com/TRIQS/triqs   \
                                              triqs.git
           mkdir triqs.build && pushd triqs.build
           cmake ../triqs.git                                                  \
             -DCMAKE_BUILD_TYPE=Release                                        \
             -DCMAKE_INSTALL_PREFIX=${HOME}/triqs                              \
             -DBuild_Tests=OFF
           make -j2
           make install
           popd

    - name: Checkout edipack2triqs
      uses: actions/checkout@v6

    - name: Test edipack2triqs
      shell: "bash -l {0}"
      run: |
           source ${HOME}/edipack/bin/edipack_config_user.sh
           source ${HOME}/triqs/share/triqs/triqsvars.sh
           py.test -v tests/

    - name: Install Sphinx and related packages
      if: env.DEPLOY_DOCS == 'true'
      shell: "bash -l {0}"
      run: >
           pip install
           "sphinx<9" sphinx-rtd-theme sphinxfortran-ng
           myst-parser nbsphinx linkify-it-py enum-tools[sphinx]

    - name: Build documentation
      if: env.DEPLOY_DOCS == 'true'
      shell: "bash -l {0}"
      run: |
           source ${HOME}/triqs/share/triqs/triqsvars.sh
           sphinx-build -M html doc/ build/sphinx

    - name: Deploy documentation
      if: env.DEPLOY_DOCS == 'true'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        token: ${{ secrets.GITHUB_TOKEN }}
        folder: build/sphinx/html
